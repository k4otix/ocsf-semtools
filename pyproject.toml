[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ocsf-toolkit"
dynamic = ["version"]
description = "Version-pinned OCSF schema for Python: build, check and repair events, extract observables, diff versions, and generate typed msgspec models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Eddie Allan" }]
keywords = [
    "ocsf",
    "open-cybersecurity-schema-framework",
    "security",
    "siem",
    "schema",
    "validation",
    "observables",
    "msgspec",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["msgspec>=0.22,<1"]

[project.urls]
Documentation = "https://github.com/k4otix/ocsf-toolkit/tree/main/docs"
Repository = "https://github.com/k4otix/ocsf-toolkit"
Issues = "https://github.com/k4otix/ocsf-toolkit/issues"
Changelog = "https://github.com/k4otix/ocsf-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
ocsf-toolkit = "ocsf_toolkit.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-randomly",
    "hypothesis",
    "pyright",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ocsf_toolkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ocsf_toolkit"]

# An allowlist: hatchling honours .gitignore but not .git/info/exclude, so anything kept out of
# git only locally would otherwise ship in an sdist built from a working tree.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs/cli.md",
    "docs/diff.md",
    "docs/events.md",
    "docs/models.md",
    "docs/observables.md",
    "docs/schema.md",
    "packaging",
    "ocsf.lock",
    "uv.lock",
    "Makefile",
    ".importlinter",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/ocsf_toolkit/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "PIE", "RET"]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# pydocstyle's docstring-shape rules govern library prose, not test code
"tests/**" = ["D"]

# tests/golden and tests/generated/samples import the generated package, which exists only after
# `make generate`; tests/generated/test_static.py type-checks them against it.
[tool.pyright]
include = ["src", "tests", "packaging"]
exclude = ["src/ocsf_toolkit/_version.py", "tests/golden", "tests/generated/samples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "packaging"]
exclude = ["src/ocsf_toolkit/_version\\.py$", "^tests/golden/", "^tests/generated/samples/"]

# README.md and docs/*.md run as doctests: every >>> example in the user docs executes.
# docs/design and docs/prior-art are maintainer-local and never collected.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md", "docs"]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--doctest-glob=*.md",
    "--ignore=docs/design",
    "--ignore=docs/prior-art",
]
markers = ["network: reaches PyPI through uv; skipped when UV_OFFLINE is set"]
