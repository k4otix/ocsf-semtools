# Release: on a v* tag, run the schema gates, build core and every model-window dist twice
# (byte-identical, SOURCE_DATE_EPOCH), check each wheel holds the tree ocsf.lock pins, publish core
# plus the dists PyPI lacks (a new tree, or a core outside the published dist's range) through
# trusted publishing, and attach ocsf.lock and SHA256SUMS to a GitHub release.
# workflow_dispatch runs everything up to the publish step and publishes nothing. A tag also needs a
# successful ci.yaml run on its commit before the approval.
#
# PyPI setup (once per project): a trusted publisher bound to this repository and workflow
# release.yaml, with one GitHub environment per project, because PyPI lets one pending publisher
# configuration create only one project: ocsf-toolkit -> environment pypi, and each
# ocsf-toolkit-v<x>-<y>-<z> -> environment pypi-v<x>-<y>-<z>. Each project publishes from its own
# job in its own environment, and only after the `approve` job passes the protected `release`
# environment.
#
# PyPI allows only three pending publishers per account, so a dist can wait for its publisher. The
# repository variable RELEASE_HOLD_DISTS lists such OCSF versions (space-separated, e.g. "1.9.0"):
# they are built and checked but not published, and the next release publishes them, since PyPI
# still lacks them. Clear an entry once its pending publisher exists.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# explicit, so every step runs as `bash -eo pipefail`: a failure inside a pipe fails the step
defaults:
  run:
    shell: bash

# Tag releases queue behind one another, never in parallel. Dry runs (workflow_dispatch, ref_type
# branch) queue in a group of their own, so a dry run can't displace a tag release waiting its turn.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  schema:
    uses: ./.github/workflows/schema.yaml # gates 1 and 2 for every lockfile entry

  build:
    needs: schema
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.choose.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32" # the uv that builds releases; bumped by hand
          python-version: "3.14" # the interpreter every release step runs on
          enable-cache: false # release artifacts never build from a restored cache
      - run: uv sync --locked
      - name: Version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(make --no-print-directory version) # hatch-vcs, with the pinned backend
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "tag $TAG builds version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Lint, types and tests
        run: |
          make lint
          uv run pyright
          uv run pytest
      - name: Build (gate 3, wheels checked against ocsf.lock)
        run: make wheels
      - name: Build again and compare (reproducible with the pinned backend)
        run: |
          make wheels WHEELS=build/wheels-again
          diff <(cd build/wheels && sha256sum ./*) <(cd build/wheels-again && sha256sum ./*)
      - name: Typed use of the dists
        run: make test-generated
      - name: The dists already on PyPI run on this core
        run: make compat
      - name: Choose the files and projects to publish
        id: choose
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOLD: ${{ vars.RELEASE_HOLD_DISTS }}
        run: |
          mkdir -p upload
          cp build/wheels/ocsf_toolkit-* upload/
          projects='[{"project":"ocsf-toolkit","prefix":"ocsf_toolkit-","environment":"pypi"}]'
          dists="" held=""
          for v in $(uv run python packaging/version_dist/dist.py unpublished --version "$VERSION"); do
            if [[ " $HOLD " == *" $v "* ]]; then held="$held $v"; else dists="$dists $v"; fi
          done
          dists=${dists# } held=${held# }
          for v in $dists; do
            cp build/wheels/ocsf_toolkit_v"${v//./_}"-* upload/
            projects=$(jq -c --arg d "${v//./-}" --arg u "${v//./_}" \
              '. + [{project: "ocsf-toolkit-v\($d)", prefix: "ocsf_toolkit_v\($u)-",
                     environment: "pypi-v\($d)"}]' <<< "$projects")
          done
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          (cd upload && sha256sum ./* | sed 's| \./| |') > SHA256SUMS
          {
            echo "### ocsf-toolkit $VERSION"
            echo "model dists to publish: ${dists:-none (every published tree is current)}"
            echo "model dists held back (RELEASE_HOLD_DISTS): ${held:-none}"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dists
          path: upload/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: |
            SHA256SUMS
            ocsf.lock
          if-no-files-found: error

  # A tag must name a commit the ci workflow passed on: the build job above tests on one Python, and
  # ci.yaml covers 3.12-3.14 and the generated dists.
  ci-passed:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: ci.yaml succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh run list --workflow ci.yaml --commit "$SHA" --status success --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "::error::ci.yaml has no successful run on $SHA; once it passes, re-run this job"
            exit 1
          fi

  # The one approval for a release. The per-project environments below exist to identify each
  # project to PyPI; GitHub creates a missing environment unprotected on first use, so protection
  # must not depend on them. Environment `release`: required reviewers, deployments from v* tags.
  approve:
    if: github.ref_type == 'tag'
    needs: [build, ci-passed]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "release approved"

  publish:
    if: github.ref_type == 'tag'
    needs: [build, approve]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.projects) }}
    name: publish ${{ matrix.project }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write # trusted publishing; no API token exists
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dists
          path: all/
      - name: Select this project's files
        env:
          PREFIX: ${{ matrix.prefix }} # a file name prefix set by the build job
        run: |
          mkdir dist
          cp all/"$PREFIX"* dist/
          ls dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # a re-run after a partial publish skips what PyPI already has; the build is reproducible,
          # so a file of the same name is the same file
          skip-existing: true

  # Runs even if one dist's upload failed: the tag still gets its release, and the next release
  # publishes that dist, as PyPI still lacks it.
  github-release:
    if: ${{ !cancelled() && needs.approve.result == 'success' }}
    needs: [approve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets/
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PUBLISHED: ${{ needs.publish.result }}
        run: |
          notes="See CHANGELOG.md. SHA256SUMS lists the files this release built for PyPI, with their sha256."
          if [ "$PUBLISHED" != success ]; then
            notes="$notes Some uploads failed; see the workflow run. The next release publishes them."
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" assets/*
