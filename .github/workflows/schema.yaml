# Schema reproducibility gates, for every ocsf.lock entry:
#   gate 1: clone the pinned commit, compile on Python 3.14, assert the compiled version equals the
#           declared one and the canonical sha256 equals compiled_sha256;
#   gate 2: rebuild the IR, assert it matches ir_sha256 and data/ir-<ver>.json (entries that ship
#           an IR), and run the loader's key-accounting and round-trip tests on the compiled schema.
# Gate 3 (regeneration) needs no compile step and runs in ci.yaml on every PR. On a PR that
# changes a shipped IR, the semver job writes the release category (repo plan §4.1) to the summary.
# release.yaml calls this workflow before it builds anything.
name: schema

on:
  pull_request:
    paths:
      - ocsf.lock
      - src/ocsf_toolkit/cli/**
      - src/ocsf_toolkit/data/**
      - src/ocsf_toolkit/ir.py
      - src/ocsf_toolkit/loader.py
      - src/ocsf_toolkit/export.py
      - tests/unit/test_ir_loader.py
      - tests/unit/test_export.py
      - .github/workflows/schema.yaml
  schedule:
    - cron: "17 4 * * *" # nightly: catches compiler/uvx drift with no repo change
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch's IRs, and hatch-vcs
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Release category for each changed IR (repo plan §4.1)
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          {
            echo "### Shipped IR changes"
            changed=$(git diff --name-only "$BASE"...HEAD -- 'src/ocsf_toolkit/data/ir-*.json')
            [ -n "$changed" ] || echo "none: patch"
            for path in $changed; do
              name=$(basename "$path")
              if [ ! -f "$path" ]; then
                echo "- $name: removed from core: major"
              elif ! git cat-file -e "$BASE:$path" 2>/dev/null; then
                echo "- $name: new OCSF version: minor"
              else
                git show "$BASE:$path" > "$RUNNER_TEMP/$name"
                status=0
                category=$(uv run ocsf-toolkit diff --semver "$RUNNER_TEMP/$name" "$path") \
                  || status=$?
                [ "$status" -le 1 ] || exit "$status" # 1 only means the IRs differ
                echo "- $name: $category"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  entries:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lock.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, tomllib
          with open("ocsf.lock", "rb") as f:
              schemas = tomllib.load(f)["schemas"]
          entries = [
              {"version": s["version"], "commit": s["commit"], "ir": bool(s["ir_sha256"])}
              for s in schemas
          ]
          print("matrix=" + json.dumps(entries))
          EOF

  compile:
    needs: entries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.entries.outputs.matrix) }}
    name: compile ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Cache upstream checkout (keyed on the pinned commit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ocsf-schema/${{ matrix.commit }}
          key: ocsf-schema-${{ matrix.commit }}
      - run: uv sync --locked
      - name: Compile and verify (gate 1)
        env:
          VERSION: ${{ matrix.version }}
        run: uv run ocsf-toolkit compile "$VERSION"
      - name: IR matches ir_sha256 and data/ (gate 2)
        if: matrix.ir
        env:
          VERSION: ${{ matrix.version }}
        run: uv run ocsf-toolkit ir check "$VERSION"
      - name: Loader key accounting and IR round-trip (gate 2)
        run: uv run pytest tests/unit/test_ir_loader.py tests/unit/test_export.py
