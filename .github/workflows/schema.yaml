# Schema reproducibility gates, for every ocsf.lock entry:
#   gate 1: clone the pinned commit, compile on Python 3.14, assert the compiled version equals the
#           declared one and the canonical sha256 equals compiled_sha256;
#   gate 2: rebuild the IR, assert it matches ir_sha256 and data/ir-<ver>.json (entries that ship
#           an IR), and run the loader's key-accounting and round-trip tests on the compiled schema.
# The regeneration gate (3) joins in M6.
name: schema

on:
  pull_request:
    paths:
      - ocsf.lock
      - src/ocsf_toolkit/cli/**
      - src/ocsf_toolkit/data/**
      - src/ocsf_toolkit/ir.py
      - src/ocsf_toolkit/loader.py
      - src/ocsf_toolkit/export.py
      - tests/unit/test_ir_loader.py
      - tests/unit/test_export.py
      - .github/workflows/schema.yaml
  schedule:
    - cron: "17 4 * * *" # nightly: catches compiler/uvx drift with no repo change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entries:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lock.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: lock
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, tomllib
          with open("ocsf.lock", "rb") as f:
              schemas = tomllib.load(f)["schemas"]
          entries = [
              {"version": s["version"], "commit": s["commit"], "ir": bool(s["ir_sha256"])}
              for s in schemas
          ]
          print("matrix=" + json.dumps(entries))
          EOF

  compile:
    needs: entries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.entries.outputs.matrix) }}
    name: compile ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags
      - uses: astral-sh/setup-uv@v7
      - name: Cache upstream checkout (keyed on the pinned commit)
        uses: actions/cache@v6
        with:
          path: build/ocsf-schema/${{ matrix.commit }}
          key: ocsf-schema-${{ matrix.commit }}
      - run: uv sync --locked
      - name: Compile and verify (gate 1)
        env:
          VERSION: ${{ matrix.version }}
        run: uv run ocsf-toolkit compile "$VERSION"
      - name: IR matches ir_sha256 and data/ (gate 2)
        if: matrix.ir
        env:
          VERSION: ${{ matrix.version }}
        run: uv run ocsf-toolkit ir check "$VERSION"
      - name: Loader key accounting and IR round-trip (gate 2)
        run: uv run pytest tests/unit/test_ir_loader.py tests/unit/test_export.py
